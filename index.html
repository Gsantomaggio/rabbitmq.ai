<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RabbitMQ AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            text-align: center;
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        .progress-bar {
            width: 100%;
            height: 10px;
            background-color: #e0e0e0;
            border-radius: 5px;
            overflow: hidden;
        }
        .progress {
            width: 0;
            height: 100%;
            background-color: #4CAF50;
            animation: progress 3s ease-in-out infinite;
        }
        @keyframes progress {
            0% { width: 0; }
            50% { width: 70%; }
            100% { width: 0; }
        }
        .gear {
            position: absolute;
            animation: spin 4s linear infinite;
        }
        .gear-1 {
            top: -20px;
            left: -20px;
            font-size: 40px;
        }
        .gear-2 {
            bottom: -20px;
            right: -20px;
            font-size: 40px;
        }
        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
<div class="container">
    <h1>RabbitMQ ai.. coming Soon!</h1>
    <p>We're working hard to bring you something amazing. Stay tuned!</p>
    <p>Project page: <a href="https://github.com/Gsantomaggio/rabbitmq.ai" target="_blank" rel="noopener noreferrer" aria-label="Open rabbitmq.ai project on GitHub">rabbitmq.ai on GitHub</a></p>
    <div class="progress-bar">
        <div class="progress"></div>
    </div>
    <div class="gear gear-1">⚙️</div>
    <div class="gear gear-2">⚙️</div>
</div>
</body>
</html>
